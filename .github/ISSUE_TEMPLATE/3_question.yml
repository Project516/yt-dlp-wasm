name: Question
description: Ask how to use yt-dlp-wasm
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Not providing the required (*) information or removing the template will result in your issue being closed and ignored.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I'm asking a question, not reporting a bug or requesting a feature
          required: true
        - label: I've read the [README](https://github.com/Project516/yt-dlp-wasm#readme) and searched [the issues](https://github.com/Project516/yt-dlp-wasm/issues?q=is%3Aissue)
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Say where you run it (browser or Node.js) and what you have tried
    validations:
      required: true
