name: Release after sync
on:
  pull_request:
    types: [closed]
    branches: ['master']

permissions: {}

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the library release
    if: >-
      ${{ github.event.pull_request.merged
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'sync/yt-dlp-') }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
    - name: Require SYNC_TOKEN
      env:
        SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      run: |
        [ -n "${SYNC_TOKEN}" ] || { echo "::error::The SYNC_TOKEN secret is not set."; exit 1; }
    # A tag pushed with the built-in token starts no workflows, so release-js.yml needs this one
    - name: Push the next minor version tag
      env:
        GH_TOKEN: ${{ secrets.SYNC_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      run: |
        set -euo pipefail
        refs="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/js-v" --paginate --jq '.[] | "\(.ref) \(.object.sha)"')"
        if existing="$(grep " ${MERGE_SHA}\$" <<< "${refs}")"; then
          echo "Already tagged: ${existing}"
          exit 0
        fi
        latest="$(sed -n 's#^refs/tags/js-v\([0-9]*\.[0-9]*\.[0-9]*\) .*#\1#p' <<< "${refs}" | sort -V | tail -n1)"
        if [ -z "${latest}" ]; then
          latest="$(gh api "repos/${GH_REPO}/contents/packages/yt-dlp-wasm/package.json?ref=${MERGE_SHA}" \
            --jq .content | base64 -d | jq -r .version)"
        fi
        IFS=. read -r major minor _ <<< "${latest}"
        tag="js-v${major}.$((minor + 1)).0"

        gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${MERGE_SHA}" --silent
        echo "Pushed ${tag} at ${MERGE_SHA}, after ${latest}." | tee -a "${GITHUB_STEP_SUMMARY}"
