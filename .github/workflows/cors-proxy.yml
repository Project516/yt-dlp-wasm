name: Deploy proxies
on:
  push:
    branches: ['master']
    paths:
      - packages/cors-proxy/**
      - .github/workflows/cors-proxy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: cors-proxy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy demo proxy
    permissions:
      contents: read
    environment: demo-proxy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @project516/cors-proxy
    - name: Deploy
      working-directory: packages/cors-proxy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: pnpm exec wrangler deploy --env demo

  deploy-personal:
    name: Deploy personal proxy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Check the secrets
      id: secrets
      env:
        PERSONAL_PROXY_HOST: ${{ secrets.PERSONAL_PROXY_HOST }}
        PERSONAL_PROXY_ORIGINS: ${{ secrets.PERSONAL_PROXY_ORIGINS }}
      run: |
        if [ -n "$PERSONAL_PROXY_HOST" ] && [ -n "$PERSONAL_PROXY_ORIGINS" ]; then
          echo "::add-mask::$PERSONAL_PROXY_HOST"
          echo "enabled=true" >>"$GITHUB_OUTPUT"
        else
          echo "PERSONAL_PROXY_HOST or PERSONAL_PROXY_ORIGINS is not set, skipping."
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      if: steps.secrets.outputs.enabled == 'true'
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      if: steps.secrets.outputs.enabled == 'true'
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      if: steps.secrets.outputs.enabled == 'true'
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Install dependencies
      if: steps.secrets.outputs.enabled == 'true'
      run: pnpm install --frozen-lockfile --filter @project516/cors-proxy
    - name: Deploy
      if: steps.secrets.outputs.enabled == 'true'
      working-directory: packages/cors-proxy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        PERSONAL_PROXY_HOST: ${{ secrets.PERSONAL_PROXY_HOST }}
        PERSONAL_PROXY_ORIGINS: ${{ secrets.PERSONAL_PROXY_ORIGINS }}
      run: |
        node -e '
        const { PERSONAL_PROXY_HOST: host, PERSONAL_PROXY_ORIGINS: origins } = process.env;
        const config = {
          name: "yt-dlp-wasm-proxy",
          main: "worker.js",
          compatibility_date: "2026-09-01",
          workers_dev: false,
          routes: [{ pattern: host, custom_domain: true }],
          vars: { ALLOWED_ORIGINS: origins, REQUIRE_ACCESS_KEY: "true" },
        };
        require("node:fs").writeFileSync("wrangler.personal.json", JSON.stringify(config));
        '
        pnpm exec wrangler deploy --config wrangler.personal.json
