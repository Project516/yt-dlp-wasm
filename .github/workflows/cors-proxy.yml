name: Deploy demo proxy
on:
  push:
    branches: ['master']
    paths:
      - packages/cors-proxy/**
      - .github/workflows/cors-proxy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: cors-proxy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy demo proxy
    permissions:
      contents: read
    environment: demo-proxy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @project516/cors-proxy
    - name: Deploy
      working-directory: packages/cors-proxy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: pnpm exec wrangler deploy --env demo
