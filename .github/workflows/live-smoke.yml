name: Live demo smoke test
on:
  schedule:
    # 11:43 UTC is 05:43 CST and 06:43 CDT. The upstream sync runs at 09:17 UTC
    - cron: '43 11 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/live-smoke.yml']

permissions: {}

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  test:
    name: Live demo (Chromium)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @project516/yt-dlp-wasm-demo...
    - name: Install Chromium
      working-directory: apps/demo
      run: pnpm exec playwright install --with-deps chromium
    - name: Run the live tests
      working-directory: apps/demo
      run: pnpm test:live
    - name: Write the summary
      if: ${{ !cancelled() }}
      working-directory: apps/demo
      run: node test-live/summary.mjs >> "${GITHUB_STEP_SUMMARY}"
    - name: Probe the proxy
      if: ${{ !cancelled() }}
      run: |
        probe="$(curl -sS -m 30 -o /dev/null -D - -H 'Origin: https://yt-dlp-wasm.project516.dev' \
          'https://yt-dlp-demo-proxy.project516.dev/?url=https%3A%2F%2Farchive.org%2Fmetadata%2Fwonder_bread' \
          | grep -iE '^(HTTP|cf-mitigated|x-ytdlp-status)' | tr -d '\r' | paste -sd ' ')" || probe=unreachable
        printf '\nProxy probe from the runner: %s\n' "${probe}" >> "${GITHUB_STEP_SUMMARY}"
    - name: Upload the results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: live-results
        path: apps/demo/live-results
        if-no-files-found: warn

  report:
    name: Report to the issue
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    permissions:
      issues: write  # Opens, comments on and closes the failure issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Download the results
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: live-results
        path: live-results
    - name: Open, update or close the issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TEST_RESULT: ${{ needs.test.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        title="Live demo smoke test failing"
        number="$(gh issue list --state open --limit 200 --json number,title \
          | jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' | head -n1)"
        failures=""
        if [ -f live-results/failures.md ]; then failures="$(cat live-results/failures.md)"; fi
        if [ "${TEST_RESULT}" = success ]; then
          if [ -n "${number}" ]; then
            gh issue close "${number}" --comment "The live smoke test passes again: ${RUN_URL}"
          fi
          exit 0
        fi
        if [ -z "${failures}" ]; then
          failures="The job failed before it recorded any case."
        fi
        {
          echo "The live smoke test of https://yt-dlp-wasm.project516.dev failed."
          echo
          echo "${failures}"
          echo
          echo "Run: ${RUN_URL}"
        } > "${RUNNER_TEMP}/issue.md"
        if [ -n "${number}" ]; then
          gh issue comment "${number}" --body-file "${RUNNER_TEMP}/issue.md"
        else
          gh issue create --title "${title}" --body-file "${RUNNER_TEMP}/issue.md"
        fi
