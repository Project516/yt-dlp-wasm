name: Live demo smoke test
on:
  schedule:
    # 11:43 UTC is 05:43 CST and 06:43 CDT. The upstream sync runs at 09:17 UTC
    - cron: '43 11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  test:
    name: Live demo (Chromium)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @project516/yt-dlp-wasm-demo...
    - name: Install Chromium
      working-directory: apps/demo
      run: pnpm exec playwright install --with-deps chromium
    - name: Run the live tests
      working-directory: apps/demo
      run: pnpm test:live
    - name: Write the summary
      if: ${{ !cancelled() }}
      working-directory: apps/demo
      run: node test-live/summary.mjs >> "${GITHUB_STEP_SUMMARY}"
    - name: Upload the results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: live-results
        path: apps/demo/live-results
        if-no-files-found: warn
