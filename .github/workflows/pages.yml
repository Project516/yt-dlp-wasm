name: Deploy demo site
on:
  push:
    branches: ['master']
    paths:
      - apps/demo/**
      - packages/yt-dlp-wasm/**
      - yt_dlp/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo site
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '26'
        package-manager-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'
    - name: Install wheel build requirements
      run: |
        python -m pip install -U --require-hashes -r bundle/requirements/pip.txt
        python -m pip install -U --require-hashes -r bundle/requirements/build.txt
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter @project516/yt-dlp-wasm-demo...
    - name: Build the yt-dlp wheel
      working-directory: packages/yt-dlp-wasm
      run: pnpm build
    - name: Build the demo
      working-directory: apps/demo
      env:
        VITE_DEMO_PROXY_URL: https://yt-dlp-demo-proxy.project516.dev
      run: pnpm build
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: apps/demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write  # Needed to publish the site
      id-token: write  # Needed to prove the deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
